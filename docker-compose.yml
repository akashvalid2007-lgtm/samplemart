services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sudharshanmart-app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - AI_CHATBOT_PROVIDER=mock
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - sudharshanmart_data:/opt/sudharshanmart/data
    restart: unless-stopped

volumes:
  sudharshanmart_data:
